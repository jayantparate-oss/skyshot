<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Sparks | Host</title><style>*{box-sizing:border-box}body{margin:0;background:#090c1a;color:#f6f5ff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.box{background:#111529;border:1px solid #292e46;border-radius:18px;padding:34px;max-width:440px;width:100%}.brand{font-size:20px;font-weight:800}.brand b,.label{color:#c7f978}.label{letter-spacing:2px;font-size:11px;font-weight:700;margin-top:36px}h1{font-size:30px;letter-spacing:-1px}p{color:#a4a8bf;line-height:1.6;font-size:14px}input{width:100%;background:#0c1020;border:1px solid #363b53;color:white;border-radius:9px;padding:14px;margin:14px 0}button{width:100%;padding:14px;background:#c7f978;color:#111a0c;border:0;border-radius:9px;font-weight:700;cursor:pointer}.error{color:#ff9d9d;min-height:20px}a{color:#c7f978}</style></head><body><main class="box"><div class="brand"><b>✳</b> sky sparks / host</div><div class="label">HOST ACCESS</div><h1>Let's light up the sky.</h1><p>Enter the host password you set in your hosting platform. Keep it private; share only the student page.</p><form id="login"><input type="password" id="secret" placeholder="Host password" required autocomplete="current-password"><button>Open host dashboard →</button></form><p id="error" class="error" role="alert"></p><p>Are you a student? <a href="/">Go to the student page</a></p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();let secret=document.getElementById('secret').value,error=document.getElementById('error');try{let r=await fetch('/api/state?host='+encodeURIComponent(secret));let data=await r.json();if(!data.isHost){error.textContent='Incorrect host password. Please try again.';return}location.href='/?host='+encodeURIComponent(secret)}catch(e){error.textContent='Could not connect to the server. Please try again.'}};</script></body></html>
